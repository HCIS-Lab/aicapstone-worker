# Eval worker for one GPU. Preferred entry point: `./setup.sh` (writes
# .env, builds the image on this machine, brings the container up).
# Manual path: copy .env.example → .env, edit, then `docker compose up -d --build`.
#
# The image is built from this directory alone (Dockerfile.real): the
# simulator source is in sim/. For a GPU-less UI test, setup.sh --mode=mock
# layers docker-compose.mock.yml on top (via COMPOSE_FILE in .env).

services:
  worker-agent:
    build:
      context: .
      dockerfile: Dockerfile.real
    image: aicapstone-worker-real:local
    pull_policy: build
    # Derived from the host port by setup.sh so several workers on one host
    # (one per GPU, each in its own clone) get unique names.
    container_name: ${WORKER_CONTAINER_NAME:-worker-agent}
    restart: unless-stopped
    ports:
      # The UI. setup.sh picks the first free port in 8081..8181.
      - "${WORKER_HOST_PORT:-8081}:8080"
    env_file: .env
    volumes:
      # Policy zips, logs, videos.
      - worker_storage:/var/lib/worker-agent/storage
      # Tasks, settings, run history (local.db).
      - worker_state:/var/lib/worker-agent/state
      # Omniverse asset cache — multi-GB and slow to warm; kept across
      # container recreations. `docker compose down -v` wipes it.
      - worker_ov_cache:/root/.cache/ov
    # One GPU per worker; setup.sh picks a free GPU_ID.
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GPU_ID:-0}
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,utility,compute
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  worker_storage:
  worker_state:
  worker_ov_cache:
